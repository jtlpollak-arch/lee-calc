<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מחשבון פתרון גשר | משכנתא</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary: #D4AF37; --secondary: #1a1a1a; --bg: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #333; }
        .calc-container { max-width: 400px; margin: auto; border: 1px solid #eee; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .result-box { background: #f9f9f9; padding: 15px; border-radius: 10px; text-align: center; margin-top: 20px; border: 1px solid var(--primary); }
        .monthly-payment { font-size: 24px; color: var(--secondary); font-weight: bold; }
        .btn-update { width: 100%; background: var(--secondary); color: var(--primary); border: 2px solid var(--primary); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-update:hover { background: var(--primary); color: white; }
        .gap-warning { font-size: 12px; color: #e74c3c; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="header">
        <h2 style="margin:0; color: var(--secondary);">מחשבון גשר פיננסי</h2>
    </div>

    <div class="input-group">
        <label>סכום המשכנתא הנדרש (₪)</label>
        <input type="text" id="loanAmount" placeholder="הזן סכום" oninput="formatLoanInput(this)">
        <div id="gapNote" class="gap-warning">הוזן אוטומטית לפי הפער בפרויקט</div>
    </div>

    <div class="input-group">
        <label>תקופה (שנים)</label>
        <input type="number" id="years" value="25">
    </div>

    <div class="input-group">
        <label>ריבית שנתית משוערת (%)</label>
        <input type="number" id="interest" value="4.5" step="0.1">
    </div>

    <div class="result-box">
        <div>החזר חודשי משוער:</div>
        <div class="monthly-payment" id="monthlyPayment">₪ 0</div>
    </div>

<!--    <button class="btn-update" onclick="applyToProject()">עדכן משכנתא בפרויקט</button> -->
</div>

<script>
    // קריאת נתונים מה-URL (הפער שנשלח מ-client.html)
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const gap = urlParams.get('gap');
        if (gap) {
            const loanInput = document.getElementById('loanAmount');
            // 1. ניקוי והשמת הערך
            const rawValue = Math.abs(Math.round(gap));
            loanInput.value = rawValue;
            
            // 2. הפעלת הפורמט באופן ידני כדי שיופיעו פסיקים מיד
            window.formatLoanInput(loanInput);
            
            document.getElementById('gapNote').style.display = 'block';
            calculate();
        }
    };

    function calculate() {
        // שינוי כאן: חייבים לנקות את הפסיקים לפני החישוב
        const p = LocalFormat.clean(document.getElementById('loanAmount').value);
        const r = parseFloat(document.getElementById('interest').value) / 100 / 12;
        const n = parseFloat(document.getElementById('years').value) * 12;

        if (p > 0 && r > 0 && n > 0) {
            const monthly = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            document.getElementById('monthlyPayment').innerText = '₪ ' + Math.round(monthly).toLocaleString();
        }
    }

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', calculate);
    });

    function applyToProject() {
        const finalAmount = document.getElementById('loanAmount').value;
        // שליחת הודעה לדף האב (client.html)
        window.parent.postMessage({
            type: 'UPDATE_MORTGAGE',
            amount: finalAmount
        }, '*');
    }


    const LocalFormat = {
    // מנקה פסיקים ומחזיר מספר
    clean: (val) => {
        if (!val) return 0;
        return parseFloat(String(val).replace(/[^\d.]/g, '')) || 0;
    },
    // מוסיף פסיקים לתצוגה
    format: (num) => {
        return new Intl.NumberFormat('he-IL').format(Math.floor(num));
    }
};

// הפונקציה שנקראת מה-oninput של ה-input
window.formatLoanInput = (input) => {
    let raw = LocalFormat.clean(input.value);
    if (raw === 0 && input.value === "") return;
    input.value = LocalFormat.format(raw);
};
</script>

</body>
</html>
