<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרכז הפיקוד | לי אטדגי</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --dark-bg: #050505; --card-bg: #121212; }
        body { font-family: 'Assistant', sans-serif; background-color: var(--dark-bg); color: white; margin: 0; }
        .gold-text { color: var(--gold); }
        .dark-card { background-color: var(--card-bg); border: 1px solid #222; transition: 0.3s; }
        .dark-card:hover { border-color: #444; transform: translateY(-2px); }
        .stat-card { border-top: 4px solid var(--gold); }
        .task-done { opacity: 0.25; filter: grayscale(1); text-decoration: line-through; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .progress-container { width: 100%; height: 8px; background: #222; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #FFD700, #B8860B); transition: width 0.5s ease-in-out; width: 0%; }

        /* סגנון למודאל יצירת אירוע */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: #121212; border: 1px solid var(--gold); max-width: 450px; margin: 10vh auto; padding: 2rem; border-radius: 1.5rem; }
        input, select { background: #1a1a1a !important; border: 1px solid #333 !important; color: white !important; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div id="event-modal" class="modal px-4">
        <div class="modal-content shadow-2xl">
            <h3 class="text-xl font-bold gold-text mb-6 flex items-center gap-2"><span>📅</span> קביעת אירוע חדש</h3>
            <div class="space-y-4 text-right">
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">סוג האירוע</label>
                    <select id="event-type" class="w-full rounded-xl p-3 text-sm outline-none focus:border-yellow-500">
                        <option value="סיור נכסים 🏠">🏠 סיור נכסים</option>
                        <option value="פגישת חתימה 🖊️">🖊️ פגישת חתימה</option>
                        <option value="שיחת ייעוץ 📞">📞 שיחת ייעוץ</option>
                        <option value="פגישת הכרות 🤝">🤝 פגישת הכרות</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">שם הלקוח / תיאור</label>
                    <input type="text" id="event-title" placeholder="למשל: משפחת כהן" class="w-full rounded-xl p-3 text-sm outline-none focus:border-yellow-500 text-white">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">מיקום האירוע</label>
                    <input type="text" id="event-location" placeholder="כתובת הנכס או מקום הפגישה" class="w-full rounded-xl p-3 text-sm outline-none focus:border-yellow-500 text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1 text-right">תאריך</label>
                        <input type="date" id="event-date" class="w-full rounded-xl p-3 text-sm outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1 text-right">שעה</label>
                        <input type="time" id="event-time" class="w-full rounded-xl p-3 text-sm outline-none focus:border-yellow-500">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="saveEventToGoogle()" class="flex-grow bg-yellow-500 text-black font-bold p-3 rounded-xl hover:bg-yellow-400 transition-all text-sm">צור אירוע ביומן</button>
                    <button onclick="closeEventModal()" class="px-6 bg-transparent border border-gray-700 text-gray-400 rounded-xl hover:bg-gray-800 transition-all text-sm">ביטול</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="dark-card stat-card p-5 rounded-2xl flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">עסקאות בחתימה</p>
                    <h3 class="text-2xl font-bold" id="stats-signing">0</h3>
                </div>
                <span class="text-2xl">🖊️</span>
            </div>
            <div class="dark-card p-5 rounded-2xl border-t-4 border-blue-500 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">פגישות היום</p>
                    <h3 class="text-2xl font-bold" id="today-leads">0</h3>
                </div>
                <span class="text-2xl text-blue-500">📅</span>
            </div>
            <div class="dark-card p-5 rounded-2xl border-t-4 border-pink-500 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">ימי הולדת</p>
                    <h3 class="text-2xl font-bold" id="today-birthdays">0</h3>
                </div>
                <span class="text-2xl text-pink-500">🎈</span>
            </div>
            <div class="dark-card p-5 rounded-2xl border-t-4 border-green-500 flex justify-between items-center shadow-lg">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">צפי עמלות</p>
                    <h3 class="text-2xl font-bold text-green-500" id="stats-revenue">₪0</h3>
                </div>
                <span class="text-2xl">💰</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold italic">📅 הלו"ז שלי (Google)</h2>
                    <div class="flex gap-2">
                        <button onclick="openEventModal()" class="text-[10px] bg-green-600/20 text-green-400 px-3 py-1 rounded-full border border-green-400/30 hover:bg-green-600 hover:text-white transition-all">+ אירוע</button>
                        <button id="auth_button" onclick="handleAuthClick()" class="text-[10px] bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full border border-blue-400/30 hover:bg-blue-600 hover:text-white transition-all">סנכרון</button>
                    </div>
                </div>
                <div id="calendar-content" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2 text-sm italic text-gray-500 text-right">
                    טוען יומן...
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6 text-right">
                <div class="flex justify-between items-end">
                    <h2 class="text-xl font-bold italic">🎯 משימות קריטיות להיום</h2>
                    <span id="progress-text" class="text-[10px] gold-text font-bold">0% הושלמו</span>
                </div>
                
                <div class="dark-card p-6 rounded-2xl shadow-2xl bg-gradient-to-b from-[#121212] to-black border-gray-800">
                    <div class="progress-container">
                        <div id="main-progress-bar" class="progress-bar"></div>
                    </div>
                    <div id="tasks-list" class="space-y-3 min-h-[400px]"></div>
                    <div class="mt-8 pt-6 border-t border-gray-800 flex gap-2">
                        <input type="text" id="new-task-input" placeholder="הוסיפי משימה מהירה..." class="flex-grow bg-black border border-gray-700 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none text-white text-right">
                        <button id="add-task-btn" class="bg-yellow-500 text-black px-6 rounded-xl font-bold hover:bg-yellow-400 transition-all text-xs">הוספה</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6 text-right">
                <div class="space-y-3">
                    <h2 class="text-sm font-bold gold-text flex items-center gap-2 justify-end">
                        <span>⚠️</span> לקוחות ללא תנועה (+3 ימים)
                    </h2>
                    <div id="stuck-clients-list" class="space-y-3 max-h-[40vh] overflow-y-auto pr-1"></div>
                </div>

                <div class="space-y-3 pt-6 border-t border-gray-800">
                    <h2 class="text-sm font-bold text-blue-400 flex items-center gap-2 justify-end">
                        <span>🏠</span> נכסים חדשים בבנק
                    </h2>
                    <div id="new-properties-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script type="module" src="today-logic.js"></script>
</body>
</html>
