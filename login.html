<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת | לי אטדגי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #050505; color: white; }
        .gold-gradient { background: linear-gradient(90deg, #FFD700, #B8860B); }
        .dark-card { background-color: #121212; border: 1px solid #222; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full dark-card p-8 rounded-3xl shadow-2xl text-center">
        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-widest text-white uppercase">LEE ATADGI</h1>
            <p class="text-[10px] text-yellow-500 tracking-[0.3em] font-light mt-1 uppercase">Luxury Real Estate</p>
        </div>

        <h2 class="text-xl font-bold mb-6 italic">כניסה למרכז הפיקוד</h2>

        <form id="login-form" class="space-y-4 text-right">
            <div>
                <label class="text-[10px] text-gray-400 block mb-1 pr-1">אימייל</label>
                <input type="email" id="email" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm focus:border-yellow-500 outline-none transition-all">
            </div>
            <div>
                <label class="text-[10px] text-gray-400 block mb-1 pr-1">סיסמה</label>
                <input type="password" id="password" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm focus:border-yellow-500 outline-none transition-all">
            </div>
            
            <p id="error-msg" class="text-red-500 text-xs hidden text-center italic font-bold">פרטי התחברות שגויים</p>

            <button type="submit" class="w-full gold-gradient text-black font-bold p-3 rounded-xl hover:opacity-90 transition-all mt-4">התחברי למערכת</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElem = document.getElementById('error-msg');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'admin.html';
            } catch (error) {
                console.error(error);
                errorElem.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
